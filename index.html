<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#17181b" />
    <script>
      // Apply the saved theme before first paint (no flash). Keep in sync with src/hooks/useTheme.js.
      (function () {
        var t;
        try { t = localStorage.getItem('vt_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#f7f7f8';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>VibeTracker — Vibecoding Project Tracker</title>
  </head>
  <body class="min-h-full selection:bg-brand-primary selection:text-white">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
